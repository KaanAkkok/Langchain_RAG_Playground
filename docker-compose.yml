services:
  qdrant:
    image: qdrant/qdrant
    container_name: lang_rag_qdrant
    restart: unless-stopped
    environment:
      - QDRANT__LOG_LEVEL=${QDRANT_LOG_LEVEL:-WARN}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: rag_app
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_GRPC_PORT: "6334"
      GRADIO_HOST: "0.0.0.0"
      GRADIO_PORT: "7860"
    depends_on:
      - qdrant
    ports:
      - "7860:7860"
    volumes:
      - ./data/raw_documents:/app/data/raw_documents
      - ./data/saved_documents:/app/data/saved_documents
      - ./data/evaluation:/app/data/evaluation
      - hf_cache:/app/.cache/huggingface

volumes:
  qdrant_storage:
  hf_cache:
